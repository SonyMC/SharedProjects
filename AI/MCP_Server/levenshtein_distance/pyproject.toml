[project]
name = "levenshtein-distance-mcp"
version = "0.1.0"
description = "MCP server implementing the Levenshtein Distance algorithm for string similarity and edit distance calculations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10.6",
    "mcp[cli]>=1.12.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
